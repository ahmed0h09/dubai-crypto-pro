<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50/50 Trade Available</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #070b14;
      --card: #0f1623;
      --green: #00e676;
      --wa: #25d366;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #e8eef7;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.3;
      pointer-events: none; z-index: 0; animation: float 14s ease-in-out infinite;
    }
    .orb-1 { width: 450px; height: 450px; background: #00c853; top: -140px; left: -120px; }
    .orb-2 { width: 400px; height: 400px; background: #00bcd4; bottom: -100px; right: -90px; animation-delay: -5s; }
    .orb-3 { width: 300px; height: 300px; background: #7c4dff; top: 38%; left: 58%; animation-delay: -8s; opacity: 0.18; }
    @keyframes float {
      0%, 100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(35px,-45px) scale(1.06); }
      66% { transform: translate(-25px,25px) scale(0.94); }
    }
    .page {
      position: relative; z-index: 1; max-width: 1100px; margin: 0 auto;
      padding: 50px 24px 80px; text-align: center;
    }
    .badge-wrap { display: inline-block; margin-bottom: 18px; position: relative; animation: fadeDown 0.9s ease-out both; }
    .badge {
      display: inline-flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg, #00c853 0%, #00e676 50%, #69f0ae 100%);
      color: #021a0c; font-weight: 800; font-size: 26px; letter-spacing: 1.2px;
      padding: 18px 48px; border-radius: 60px; text-transform: uppercase; position: relative; z-index: 2;
      box-shadow: 0 0 20px rgba(0,230,118,0.5), 0 0 50px rgba(0,230,118,0.3);
      animation: badgePulse 2.6s ease-in-out infinite;
    }
    .badge-wrap::before {
      content: ''; position: absolute; inset: -8px; border-radius: 70px;
      background: linear-gradient(135deg, #00e676, transparent, #00c853);
      opacity: 0.6; z-index: 1; animation: ringPulse 2.6s ease-in-out infinite; filter: blur(8px);
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes ringPulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    .tagline { font-size: 16px; color: #9aabc4; margin-bottom: 30px; animation: fadeDown 0.8s ease-out 0.15s both; }
    .wa-btn {
      display: inline-flex; align-items: center; gap: 12px; background: var(--wa); color: #fff;
      font-weight: 700; font-size: 18px; padding: 15px 38px; border-radius: 50px;
      text-decoration: none; margin-bottom: 40px;
      box-shadow: 0 8px 28px rgba(37,211,102,0.4);
      animation: fadeDown 0.8s ease-out 0.25s both, waPulse 2.4s ease-in-out infinite 1.3s;
    }
    .wa-btn:hover { transform: translateY(-5px) scale(1.04); }
    .wa-icon { width: 26px; height: 26px; fill: currentColor; }
    @keyframes waPulse {
      0%, 100% { box-shadow: 0 8px 28px rgba(37,211,102,0.4); }
      50% { box-shadow: 0 8px 38px rgba(37,211,102,0.7); }
    }
    .shots {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      max-width: 520px;
      margin: 0 auto 20px;
    }
    .shot-card {
      background: var(--card); border-radius: 20px; padding: 14px;
      border: 1px solid rgba(0,230,118,0.15); box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      overflow: hidden; position: relative;
      width: 100%;
    }
    .shot-card::before {
      content: ''; position: absolute; inset: -1px; border-radius: 21px; padding: 1.5px;
      background: linear-gradient(135deg, rgba(0,230,118,0.5), transparent 40%, transparent 60%, rgba(0,230,118,0.35));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none; animation: borderGlow 4s linear infinite; z-index: 6;
    }
    @keyframes borderGlow { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .shot-card:nth-child(1) {
      animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.35s both, floatCard1 4.8s ease-in-out 1.4s infinite;
    }
    .shot-card:nth-child(3) {
      animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.55s both, floatCard2 5.4s ease-in-out 1.6s infinite;
    }
    @keyframes floatCard1 {
      0%,100% { transform: translateY(0); }
      25% { transform: translateY(-8px); }
      50% { transform: translateY(-2px); }
      75% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%,100% { transform: translateY(0); }
      25% { transform: translateY(-6px); }
      50% { transform: translateY(-12px); }
      75% { transform: translateY(-3px); }
    }
    .live-badge {
      position: absolute; top: 18px; left: 18px;
      background: rgba(0,20,10,0.85); backdrop-filter: blur(8px);
      color: #00e676; font-size: 11px; font-weight: 700; padding: 6px 12px;
      border-radius: 20px; display: flex; align-items: center; gap: 7px; z-index: 25;
      border: 1px solid rgba(0,230,118,0.45);
    }
    .live-dot {
      width: 8px; height: 8px; background: #00e676; border-radius: 50%;
      animation: livePulse 1.1s ease-in-out infinite; box-shadow: 0 0 8px #00e676;
    }
    @keyframes livePulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.65); }
    }
    .img-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      line-height: 0;
    }
    .shot-card img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }
    .shot-label {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--green);
    }
    .center-msg {
      margin: 28px 0;
      padding: 18px 28px;
      background: linear-gradient(145deg, #0f1623, #141c2b);
      border: 1px solid rgba(0, 230, 118, 0.25);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      animation: fadeUp 0.8s ease-out 0.6s both;
      position: relative;
    }
    .center-msg::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
    }
    .center-msg p {
      font-size: 17px;
      font-weight: 600;
      color: #d0d8e8;
      line-height: 1.45;
    }
    .center-msg .highlight {
      color: var(--green);
      font-weight: 800;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(50px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .particle {
      position: absolute; width: 4px; height: 4px; background: var(--green);
      border-radius: 50%; opacity: 0.4; animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
    @media (max-width: 800px) {
      .badge { font-size: 18px; padding: 14px 28px; }
      .wa-btn { font-size: 16px; padding: 14px 30px; }
      .center-msg p { font-size: 15px; }
      .page { padding: 36px 16px 60px; }
    }
  </style>
</head>
